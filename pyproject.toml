[project]
name = "omnilog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "markdown-it-py>=4.2.0",
    "openai>=1.50",
    "pydantic-ai>=2.22.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
